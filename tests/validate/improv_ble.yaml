# Fixture: Improv over BLE with no station slot — the provisioning-only device a phone reaches
# without a cable. It rides hds_v1_0 because BLE needs no pin at all, so nothing here has to be
# traded away for it. No fallback AP: BLE is the only provisioning route here, which is also what
# proves wifi.yaml accepts Improv in place of wifi_ap.yaml.
substitutions:
  device_name: improv-ble-testdev
  firmware_version: "0.0.0-test"

packages:
  criotive:
    url: https://github.com/junioteixeira/test-esphome-sdk
    ref: __SDK_REF__
    files:
      - path: hardware/hds_v1_0.yaml
      - path: modules/core.yaml
        vars: {sdk_ref: __SDK_REF__}
      - path: modules/wifi.yaml
        vars: {sdk_ref: __SDK_REF__}
      - path: modules/improv_ble.yaml
        vars: {sdk_ref: __SDK_REF__}
