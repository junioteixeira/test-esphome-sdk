# Fixture: the console-ON path — logger_level and logger_baud_rate at NON-default values. It rides
# hds_v1_0, which has no SW1, so opening the UART console costs nothing: on hds_v1_1 the console and
# the GPIO1 button are mutually exclusive. It also sets `logger: hardware_uart: UART0`, the override
# a device writes to choose its console instead of ESPHome's per-variant default — UART0 is
# what that default already is on a classic ESP32, since UART1/UART2's default pins are wired to
# flash on these modules and the logger schema exposes no tx_pin override.
substitutions:
  device_name: logger-console-testdev
  firmware_version: "0.0.0-test"
  logger_level: INFO
  logger_baud_rate: "115200"
  wifi_ssid: test-ssid
  wifi_password: test-wifi-password

logger:
  hardware_uart: UART0

packages:
  criotive:
    url: https://github.com/junioteixeira/test-esphome-sdk
    ref: __SDK_REF__
    files:
      - path: hardware/hds_v1_0.yaml
      - path: modules/core.yaml
        vars: {sdk_ref: __SDK_REF__}
      - path: modules/wifi.yaml
        vars: {sdk_ref: __SDK_REF__}
      - path: modules/criotive_mqtt.yaml
        vars: {sdk_ref: __SDK_REF__}
      - path: modules/ciotcfg.yaml
        vars: {sdk_ref: __SDK_REF__}
      - path: modules/ota.yaml
        vars: {sdk_ref: __SDK_REF__}
      - path: modules/diagnostics.yaml
        vars: {sdk_ref: __SDK_REF__}
      - path: modules/controls.yaml
        vars: {sdk_ref: __SDK_REF__}
