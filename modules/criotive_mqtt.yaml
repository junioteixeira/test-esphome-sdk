substitutions:
  # Never reboot solely because MQTT is unavailable.
  mqtt_reboot_timeout: 0s
  # On criotive's mounted listeners the device subscribes to the bare topic and
  # the broker scopes it under the cloud id. Brokers without a mountpoint can
  # override this with a device-prefixed topic for bench testing. Mirrors
  # location_system_command_topic, which is the same topic for the same reason.
  mqtt_system_command_topic: command
  mqtt_discovery: "true"

mqtt:
  id: mqtt_client

  # A placeholder, and unroutable on purpose. ESPHome's schema makes `broker` required, but every
  # value that identifies this device -- broker, port, credentials, client id, topic prefix and the
  # CA that validates the broker -- is written by `ciotcfg` at setup_priority::BUS, before the
  # client connects. Nothing here is a fallback: a device whose partition carries no usable record
  # never enables MQTT at all, so this address is never dialled.
  broker: "0.0.0.0"

  # No `certificate_authority` here, and that is what makes one image serve many environments.
  # mqtt_backend_esp32 selects MQTT_TRANSPORT_OVER_SSL from ca_certificate_ holding a value at
  # runtime and MQTT_TRANSPORT_OVER_TCP otherwise, so the anchor arrives with the credentials it
  # validates rather than being compiled in beside them.

  reboot_timeout: ${mqtt_reboot_timeout}
  discovery: ${mqtt_discovery}
  discover_ip: false
  # ESPHome's ESP32 default is false, which publishes synchronously from the
  # main loop. Its own comment on that branch says the call "might block for
  # several seconds, either due to network timeout (10s)", and Application feeds
  # the task watchdog only between component invocations. esphome/issues#6810
  # measured 20019ms in that path on a poor link, with loop watchdog resets;
  # PR#8325 added the worker thread this enables. Measured on our bench with 19
  # forced reconnects and ~40 entities: main-loop worst case 1578ms -> 352ms.
  idf_send_async: true
  log_topic: # Publishing logs is opt-in.

  # Downlink system commands. The subscription lives here because this module
  # owns the `mqtt:` block -- a second one in another module would have to wire
  # reboot_timeout of its own or silently restore ESPHome's 15min default, which
  # check-offline-survival.sh refuses. What each command DOES lives in the module
  # that owns it.
  on_json_message:
    - topic: ${mqtt_system_command_topic}
      # The platform publishes at QoS 1 and ESPHome's default here is 0. A
      # subscription at 0 lets the broker downgrade delivery, so a command would
      # be dropped on a weak link with nothing to show for it: the platform
      # reports a successful publish and the device never heard it.
      qos: 1
      then:
        - if:
            condition:
              # Every field is checked before any is used. Other system commands
              # arrive on this same topic, and a partial ota payload must be
              # ignored rather than half-acted on -- flashing with an empty md5
              # downloads the whole image and only then refuses it. Any other
              # field (`deviceId`, `ticket`, `version`) is tolerated and unused:
              # the url carries the ticket itself.
              - lambda: |-
                  return x["command"] == "ota" &&
                         x["url"].is<const char *>() &&
                         x["md5"].is<const char *>();
            then:
              - script.execute:
                  id: script_ota_from_command
                  url: !lambda 'return x["url"].as<std::string>();'
                  md5: !lambda 'return x["md5"].as<std::string>();'

  on_connect:
    - then:
        - delay: 2s
        - lambda: |-
            // Rollback confirmation is available only with ESP-IDF.
            #ifdef USE_ESP_IDF
              if (id(mqtt_client).is_connected()) {
                id(script_rollback).stop();
                esp_ota_mark_app_valid_cancel_rollback();
              }
            #endif
