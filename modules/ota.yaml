substitutions:
  ota_attempts: "50"
  ota_http_server_test: ${ota_http_server}
  # ESPHome defaults to 4.5s, which also bounds the blocking
  # esp_http_client_open()/fetch_headers() before the download loop -- where an
  # OTA over a weak TLS link dies, after publishing "OTA start".
  ota_http_timeout: 15s

safe_mode:
  num_attempts: ${ota_attempts}
  # Must exceed the 300s rollback watchdog.
  boot_is_good_after: 330s

esphome:
  on_boot:
    - priority: 600
      then:
        - script.execute: script_rollback

ota:
  - platform: esphome
    password: "${ ota_password if ota_password is defined else 1/0 }"

  - platform: http_request
    on_begin:
      - text_sensor.template.publish:
          id: ota_status
          state: "OTA start"
    on_progress:
      - lambda: |-
          char buffer[50];
          snprintf(buffer, sizeof(buffer), "OTA progress %0.1f%%", x);
          id(ota_status).publish_state(buffer);
    on_end:
      - text_sensor.template.publish:
          id: ota_status
          state: "OTA end"
      - delay: 1s # Allow MQTT to publish status.
    on_error:
      - lambda: |-
          char buffer[50];
          snprintf(buffer, sizeof(buffer), "OTA update error %d", x);
          id(ota_status).publish_state(buffer);

http_request:
  verify_ssl: false  # TODO: turn this on
  timeout: ${ota_http_timeout}
  # No `watchdog_timeout:` -- do not add one. WatchdogManager *assigns* it for
  # the request (no max against the current value), so against the boards' own
  # `esp32: watchdog_timeout: 60s` any value here narrows the watchdog instead
  # of widening it. Unset keeps the 60s: the option has no default.

text:
  - platform: template
    name: "OTA HTTPS prod"
    id: ota_https_prod
    optimistic: true
    min_length: 0
    max_length: 255
    mode: text
    on_value:
      - delay: 1s # Allow MQTT to publish status.
      - script.execute:
          id: perform_ota_update
          binary_name: !lambda 'return x;'
          server_prefix: !lambda |-
            bool is_test = false;
            for (size_t pos = x.find(".test"); pos != std::string::npos;
                 pos = x.find(".test", pos + 1)) {
              const size_t end = pos + 5;
              if (end == x.size() || x[end] == '.') {
                is_test = true;
                break;
              }
            }
            return std::string("https://") +
                   (is_test ? "${ ota_http_server_test if ota_http_server_test is defined else 1/0 }"
                            : "${ ota_http_server if ota_http_server is defined else 1/0 }");

text_sensor:
  - platform: template
    name: "OTA status"
    id: ota_status
    update_interval: never

script:
  # The platform's own OTA route. criotive_mqtt dispatches the command that
  # carries these, the same direction its on_connect already reaches in here for
  # script_rollback: the mqtt module owns the subscription, this one owns what
  # an update does. Everything needed to fetch and verify the image arrives at
  # runtime, which is what lets one build serve a fleet.
  - id: script_ota_from_command
    parameters:
      url: string
      md5: string
      device_id: string
      ticket: string
    then:
      - delay: 1s # Allow MQTT to publish status before the flash blocks the loop.
      # username/password rather than credentials spliced into the URL: the
      # action embeds them itself, and where they end up is the point.
      # ota_http_request logs the URL at ESP_LOGI and the authenticated form only
      # at ESP_LOGVV -- and the platform ingests and stores device logs, so a
      # ticket in the path would become a credential in its own database.
      - ota.http_request.flash:
          url: !lambda 'return url;'
          md5: !lambda 'return md5;'
          username: !lambda 'return device_id;'
          password: !lambda 'return ticket;'

  - id: perform_ota_update
    parameters:
      server_prefix: string
      binary_name: string
    then:
      - if:
          condition:
            - lambda: 'return binary_name.find("${device_name}_") == 0 && binary_name.find(".factory") == std::string::npos;'
          then:
            - ota.http_request.flash:
                md5_url: !lambda 'return server_prefix + binary_name + ".bin.md5";'
                url: !lambda 'return server_prefix + binary_name + ".bin";'
          else:
            - lambda: |-
                id(ota_status).publish_state("Error: this version is for another device");

  - id: script_rollback
    then:
      - delay: 300s
      - lambda: |-
          #ifdef USE_ESP_IDF
            // Never roll back a confirmed image during an outage.
            const esp_partition_t *running = esp_ota_get_running_partition();
            esp_ota_img_states_t ota_state;
            if (esp_ota_get_state_partition(running, &ota_state) == ESP_OK &&
                ota_state == ESP_OTA_IMG_PENDING_VERIFY) {
              esp_ota_mark_app_invalid_rollback_and_reboot();
            }
          #endif
